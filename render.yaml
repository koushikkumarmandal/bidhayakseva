services:
  - type: web
    name: bidhayakseva
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: mla@seva.gov.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: 9830123456
      - key: CONSTITUENCY_NAME
        value: Goghat Assembly (AC 201), Hooghly
      - key: MLA_NAME
        value: প্রশান্ত দিগর (Prashanta Digar)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        value: VA19dcbc304edf9eca50f0a7ad504dd260
